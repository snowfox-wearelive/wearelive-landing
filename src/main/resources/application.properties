spring.application.name=wearelive-landing

# 사전예약 버튼(헤더·히어로·하단 CTA)이 이동할 Google Form — 대상별로 분리.
wearelive.band.pre-registration-url=https://docs.google.com/forms/d/1k9AXAFiB6ekKuRddNuYwUhi_EzoPl2kFMu6Gv_m4BY8/viewform?edit_requested=true
wearelive.owner.pre-registration-url=https://docs.google.com/forms/d/1S69UsyIjmmL6baxdhBonj4veTa6yZE4fCjFLa_l6gJY/viewform?edit_requested=true

# Static assets: content-hashed URLs (rewritten by Thymeleaf @{...}) so they can be cached for a year.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/svg+xml
