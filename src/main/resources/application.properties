spring.application.name=wearelive-landing

# Pre-registrations: band and owner each have their own table (band_pre_registration / owner_pre_registration).
# Local default is a file-based H2 DB; point spring.datasource.* at the production DB when deploying.
spring.datasource.url=jdbc:h2:file:./data/wearelive
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Static assets: content-hashed URLs (rewritten by Thymeleaf @{...}) so they can be cached for a year.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

spring.h2.console.enabled=false
