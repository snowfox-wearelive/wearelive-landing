<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!--/* Common <head> contents. Pages add their own <title>, description and audience stylesheet. */-->
  <th:block th:fragment="head-common">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/shared/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap">
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <script th:src="@{/js/landing.js}" defer></script>
  </th:block>
</head>
<body>

<!--/* Pre-registration buttons link to ${preRegistrationUrl}: each page's controller supplies its own audience's form. */-->
<header th:fragment="header(home)" class="site-header">
  <a th:href="@{${home}}" class="site-header__logo" aria-label="WEARELIVE 홈">
    <img th:src="@{/assets/shared/logo.svg}" alt="WEARELIVE" width="107" height="28">
  </a>
  <a class="red-button red-button--sm" th:href="${preRegistrationUrl}">사전예약</a>
</header>

<footer th:fragment="footer" class="site-footer">
  <div class="site-footer__top">
    <img class="site-footer__logo" th:src="@{/assets/shared/logo.svg}" alt="WEARELIVE" width="398" height="104">
    <nav class="site-footer__cols" aria-label="푸터">
      <div class="site-footer__col">
        <p class="site-footer__label">Product</p>
        <a th:href="@{${routes.band()}}">밴드 멤버</a>
        <a th:href="@{${routes.owner()}}">대관 사장님</a>
        <a href="#faq">FAQ</a>
      </div>
      <div class="site-footer__col">
        <p class="site-footer__label">Community</p>
        <!--/* TODO: 공식 채널 URL 확정 후 연결 */-->
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
      </div>
      <div class="site-footer__col">
        <p class="site-footer__label">Company</p>
        <!--/* TODO: 문의 채널·약관 문서 URL 확정 후 연결 */-->
        <a href="#">문의하기</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">이용약관</a>
      </div>
    </nav>
  </div>
  <div class="site-footer__bottom">
    <p>© 2026 WEARELIVE. ALL RIGHTS RESERVED.</p>
    <p>SEOUL, KOREA</p>
  </div>
</footer>

<button th:fragment="top-button" type="button" class="top-button" data-top-button aria-label="맨 위로" tabindex="-1">
  <span class="top-button__arrow" aria-hidden="true">↑</span>
  <span class="top-button__label" aria-hidden="true">TOP</span>
</button>

</body>
</html>
