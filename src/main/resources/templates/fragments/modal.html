<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Pre-registration dialog shell (Figma 03/04).
  - audience:    the page's own audience ('band' | 'owner'); the form only ever submits to that audience's API
  - endpoint:    that audience's API URL
  - extraFields: audience-specific fields (fragment), or ~{} for none
  Choosing the other user type does not switch the form in place: it navigates to that audience's own page.
*/-->
<dialog th:fragment="modal(audience, endpoint, extraFields)" id="pre-register" class="pre-modal"
        aria-labelledby="pre-register-title">
  <form class="pre-modal__card" th:attr="data-endpoint=@{${endpoint}}" novalidate>
    <button type="button" class="pre-modal__close" data-reserve-close aria-label="닫기">×</button>
    <div class="pre-modal__badge">
      <span class="pill pill--small">EARLY ACCESS</span>
      <span>가장 먼저 만나보세요</span>
    </div>
    <h2 id="pre-register-title" class="pre-modal__title">WEARELIVE 사전예약</h2>
    <p class="pre-modal__desc">출시 일정과 비공개 베타 초대 소식을 이메일로 보내드립니다.</p>

    <label class="pre-modal__field">
      <span class="pre-modal__label">이름</span>
      <input class="pre-modal__input" type="text" name="name" autocomplete="name" maxlength="50"
             placeholder="이름을 입력해주세요" required>
    </label>
    <label class="pre-modal__field">
      <span class="pre-modal__label">이메일</span>
      <input class="pre-modal__input" type="email" name="email" autocomplete="email" maxlength="254"
             placeholder="you@example.com" required>
    </label>

    <fieldset class="pre-modal__group">
      <legend class="pre-modal__label">어떤 분이신가요?</legend>
      <div class="choice-row choice-row--two">
        <span th:if="${audience == 'band'}" class="choice is-selected" aria-current="true">밴드 멤버</span>
        <a th:unless="${audience == 'band'}" class="choice" th:href="@{${routes.bandReserve()}}">밴드 멤버</a>
        <span th:if="${audience == 'owner'}" class="choice is-selected" aria-current="true">대관 사장님</span>
        <a th:unless="${audience == 'owner'}" class="choice" th:href="@{${routes.ownerReserve()}}">대관 사장님</a>
      </div>
    </fieldset>

    <th:block th:replace="${extraFields}"/>

    <label class="pre-modal__consent">
      <input type="checkbox" name="marketingConsent">
      <span class="pre-modal__checkbox" aria-hidden="true"></span>
      <span>출시 및 베타 테스트 관련 소식 수신에 동의합니다.</span>
    </label>

    <p class="pre-modal__error" role="alert" data-form-error hidden></p>

    <button type="submit" class="red-button red-button--block" data-submit>무료 사전예약 완료</button>
  </form>
</dialog>

</body>
</html>
