<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/* Figma "01 랜딩 – 밴드 탭" (node 102:819) — general user (band member) landing page. */-->
<head>
  <th:block th:replace="~{fragments/layout :: head-common}"/>
  <title th:text="${page.title()}">WEARELIVE</title>
  <meta name="description" th:content="${page.description()}">
</head>
<body class="landing landing--band">
<header th:replace="~{fragments/layout :: header(${routes.band()})}"></header>

<main>
  <section th:replace="~{fragments/sections :: hero(${page})}"></section>

  <section class="audience" th:aria-label="${page.audienceLabel()}">
    <nav th:replace="~{fragments/sections :: audience-switch('band')}"></nav>
    <div th:replace="~{fragments/sections :: panel(${page.panel()})}"></div>

    <div th:replace="~{fragments/sections :: section-head(${page.problemTitle()})}"></div>
    <ol th:replace="~{fragments/sections :: problem-grid(${page.problems()})}"></ol>

    <div th:replace="~{fragments/sections :: section-head(${page.solutionTitle()})}"></div>
    <div class="solution-rows">
      <th:block th:each="row : ${page.solutions()}">
        <div th:replace="~{fragments/sections :: solution-row(${row})}"></div>
      </th:block>
    </div>
  </section>

  <section th:replace="~{fragments/sections :: faq(${page.faq()})}"></section>
  <section th:replace="~{fragments/sections :: final-cta(${page.ctaVisual()})}"></section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: overlays}"/>
<dialog th:replace="~{fragments/modal :: modal('band', ${apiEndpoint}, ~{band/position-field :: field})}"></dialog>
</body>
</html>
